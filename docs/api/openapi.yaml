          additionalProperties: true

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        identifier:
          type: string
          description: Optional 2-10 character identifier starting with a letter. Generated from the name when omitted.
          pattern: '^[A-Za-z][A-Za-z0-9]{1,9}$'
        description:
          type: string
          maxLength: 20000
        status:
          $ref: '#/components/schemas/ProjectStatus'
        logo_gradient:
          type: integer
          minimum: 0
          maximum: 7
        logo_emoji:
          type: string
        logo_gradient_from:
          type: string
          description: Start colour for a custom two-stop gradient. Send both colours to enable it.
          pattern: '^(#[0-9a-fA-F]{6})?$'
        logo_gradient_to:
          type: string
          description: End colour for a custom two-stop gradient. Send both colours to enable it.
          pattern: '^(#[0-9a-fA-F]{6})?$'
        logo_gradient_angle:
          type: integer
          minimum: 0
          maximum: 360

    UpdateProjectRequest:
